<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HandTrack">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖐️</text></svg>">
    <title>Hand Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(255,255,255,0.05);
        }
        
        h1 {
            color: #fff;
            font-size: 1.1rem;
        }
        
        .status {
            color: #888;
            font-size: 0.85rem;
        }
        
        .status.active {
            color: #00d26a;
        }
        
        .container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        video.front-camera {
            transform: scaleX(-1);
        }
        
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        
        canvas.front-camera {
            transform: scaleX(-1);
        }
        
        .controls {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            justify-content: center;
        }
        
        button {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        button:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.2);
        }
        
        button.active {
            background: rgba(0,210,106,0.25);
            border-color: #00d26a;
            color: #00d26a;
        }
        
        .cam-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 10;
        }
        
        .fps {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: monospace;
            z-index: 10;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #fff;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖐️ Hand Tracker</h1>
        <div class="status" id="status">Initialisation...</div>
    </div>
    
    <div class="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <div class="cam-indicator" id="camIndicator">📷 Avant</div>
        <div class="fps" id="fps">-- FPS</div>
        
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Chargement du modèle...</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="switchBtn">🔄 Caméra</button>
        <button id="anglesBtn" class="active">📐 Angles</button>
        <button id="pointsBtn" class="active">⚪ Points</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const camIndicator = document.getElementById('camIndicator');
        const fpsEl = document.getElementById('fps');
        const switchBtn = document.getElementById('switchBtn');
        const anglesBtn = document.getElementById('anglesBtn');
        const pointsBtn = document.getElementById('pointsBtn');
        
        let useFrontCamera = true;
        let showAngles = true;
        let showPoints = true;
        let stream = null;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        
        // Couleurs
        const fingerColors = {
            thumb: '#FFD700',
            index: '#00FF00',
            middle: '#00BFFF',
            ring: '#FF8C00',
            pinky: '#FF69B4'
        };
        
        const fingerIndices = {
            thumb: [0, 1, 2, 3, 4],
            index: [0, 5, 6, 7, 8],
            middle: [0, 9, 10, 11, 12],
            ring: [0, 13, 14, 15, 16],
            pinky: [0, 17, 18, 19, 20]
        };
        
        const palmConnections = [[5, 9], [9, 13], [13, 17], [0, 5], [0, 17], [5, 17]];
        
        function getAngle(p1, p2, p3) {
            const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
            const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
            const dot = v1.x * v2.x + v1.y * v2.y;
            const m1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            const m2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
            const cos = Math.max(-1, Math.min(1, dot / (m1 * m2)));
            return Math.round(Math.acos(cos) * 180 / Math.PI);
        }
        
        function drawHand(landmarks) {
            const w = canvas.width;
            const h = canvas.height;
            
            const pts = landmarks.map(lm => ({
                x: lm.x * w,
                y: lm.y * h
            }));
            
            // Paume
            ctx.strokeStyle = 'rgba(180, 180, 180, 0.9)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            palmConnections.forEach(([i, j]) => {
                ctx.beginPath();
                ctx.moveTo(pts[i].x, pts[i].y);
                ctx.lineTo(pts[j].x, pts[j].y);
                ctx.stroke();
            });
            
            // Doigts
            Object.entries(fingerIndices).forEach(([finger, indices]) => {
                const color = fingerColors[finger];
                ctx.strokeStyle = color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                
                for (let i = 1; i < indices.length - 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(pts[indices[i]].x, pts[indices[i]].y);
                    ctx.lineTo(pts[indices[i + 1]].x, pts[indices[i + 1]].y);
                    ctx.stroke();
                }
            });
            
            // Points
            if (showPoints) {
                pts.forEach((pt, i) => {
                    let color = '#888';
                    let radius = 6;
                    
                    if (i >= 1 && i <= 4) color = fingerColors.thumb;
                    else if (i >= 5 && i <= 8) color = fingerColors.index;
                    else if (i >= 9 && i <= 12) color = fingerColors.middle;
                    else if (i >= 13 && i <= 16) color = fingerColors.ring;
                    else if (i >= 17 && i <= 20) color = fingerColors.pinky;
                    
                    if ([4, 8, 12, 16, 20].includes(i)) radius = 12;
                    else if ([0].includes(i)) { color = '#fff'; radius = 10; }
                    else radius = 7;
                    
                    ctx.beginPath();
                    ctx.arc(pt.x + 2, pt.y + 2, radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
            
            // Angles
            if (showAngles) {
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                
                const joints = [
                    { idx: 3, pts: [2, 3, 4] },
                    { idx: 6, pts: [5, 6, 7] },
                    { idx: 7, pts: [6, 7, 8] },
                    { idx: 10, pts: [9, 10, 11] },
                    { idx: 11, pts: [10, 11, 12] },
                    { idx: 14, pts: [13, 14, 15] },
                    { idx: 18, pts: [17, 18, 19] }
                ];
                
                joints.forEach(j => {
                    const angle = getAngle(pts[j.pts[0]], pts[j.pts[1]], pts[j.pts[2]]);
                    const x = pts[j.idx].x;
                    const y = pts[j.idx].y - 15;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    const text = angle + '°';
                    const metrics = ctx.measureText(text);
                    ctx.fillRect(x - metrics.width/2 - 4, y - 12, metrics.width + 8, 18);
                    
                    ctx.fillStyle = '#fff';
                    ctx.fillText(text, x, y);
                });
            }
        }
        
        function onResults(results) {
            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                fpsEl.textContent = fps + ' FPS';
            }
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach(landmarks => {
                    drawHand(landmarks);
                });
                statusEl.textContent = '✋ ' + results.multiHandLandmarks.length + ' main(s)';
                statusEl.classList.add('active');
            } else {
                statusEl.textContent = 'En attente...';
                statusEl.classList.remove('active');
            }
        }
        
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
            }
        });
        
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.6
        });
        
        hands.onResults(onResults);
        
        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            loadingEl.classList.remove('hidden');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                
                if (useFrontCamera) {
                    video.classList.add('front-camera');
                    canvas.classList.add('front-camera');
                    camIndicator.textContent = '📷 Avant';
                } else {
                    video.classList.remove('front-camera');
                    canvas.classList.remove('front-camera');
                    camIndicator.textContent = '📷 Arrière';
                }
                
                video.onloadedmetadata = () => {
                    loadingEl.classList.add('hidden');
                    
                    async function detect() {
                        if (video.readyState >= 2) {
                            await hands.send({ image: video });
                        }
                        requestAnimationFrame(detect);
                    }
                    detect();
                };
                
            } catch (err) {
                loadingEl.classList.add('hidden');
                statusEl.textContent = '❌ ' + err.message;
            }
        }
        
        switchBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });
        
        anglesBtn.addEventListener('click', () => {
            showAngles = !showAngles;
            anglesBtn.classList.toggle('active', showAngles);
        });
        
        pointsBtn.addEventListener('click', () => {
            showPoints = !showPoints;
            pointsBtn.classList.toggle('active', showPoints);
        });
        
        hands.initialize().then(() => {
            startCamera();
        });
    </script>
</body>
</html>
