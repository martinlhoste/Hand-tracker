<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HandTrack">
    <title>Hand Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        
        body {
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
        }
        
        h1 { color: #fff; font-size: 1rem; }
        
        .status { color: #666; font-size: 0.8rem; }
        .status.active { color: #0f0; }
        .status.recording { color: #f00; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .container {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        video.mirror, canvas.mirror { transform: scaleX(-1); }
        
        .overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        
        .badge {
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        
        .fps { color: #0f0; font-family: monospace; }
        
        .controls {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        button:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }
        button.active { background: rgba(0,200,100,0.2); border-color: #0c6; color: #0c6; }
        button.rec-active { background: rgba(255,0,0,0.3); border-color: #f00; color: #f00; }
        
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            z-index: 100;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
        
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
        }
        
        .modal-header h2 { color: #fff; font-size: 1rem; }
        
        .close-btn {
            background: rgba(255,0,0,0.3);
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .playback-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        
        #playbackCanvas {
            max-width: 100%;
            max-height: 100%;
            background: #111;
        }
        
        .playback-controls {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            justify-content: center;
            align-items: center;
        }
        
        .playback-controls button {
            padding: 12px 20px;
        }
        
        .timeline {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            position: relative;
            max-width: 200px;
        }
        
        .timeline-progress {
            height: 100%;
            background: #0f0;
            border-radius: 4px;
            width: 0%;
        }
        
        .frame-count {
            color: #888;
            font-size: 0.8rem;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖐️ Hand Tracker</h1>
        <div class="status" id="status">Chargement...</div>
    </div>
    
    <div class="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <div class="overlay">
            <span class="badge" id="camBadge">📷 Avant</span>
            <span class="badge fps" id="fps">-- FPS</span>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Chargement...</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="camBtn">🔄</button>
        <button id="anglesBtn" class="active">📐</button>
        <button id="pointsBtn" class="active">⚪</button>
        <button id="recBtn">⏺️ REC</button>
        <button id="playBtn" class="hidden">▶️ Play</button>
    </div>

    <div class="modal hidden" id="modal">
        <div class="modal-header">
            <h2>📼 Enregistrement</h2>
            <button class="close-btn" id="closeBtn">✕ Fermer</button>
        </div>
        <div class="playback-container">
            <canvas id="playbackCanvas" width="400" height="300"></canvas>
        </div>
        <div class="playback-controls">
            <button id="playPauseBtn">▶️</button>
            <div class="timeline" id="timeline">
                <div class="timeline-progress" id="timelineProgress"></div>
            </div>
            <span class="frame-count" id="frameCount">0 / 0</span>
            <button id="speedBtn">1x</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const camBadge = document.getElementById('camBadge');
        const fpsEl = document.getElementById('fps');
        
        const camBtn = document.getElementById('camBtn');
        const anglesBtn = document.getElementById('anglesBtn');
        const pointsBtn = document.getElementById('pointsBtn');
        const recBtn = document.getElementById('recBtn');
        const playBtn = document.getElementById('playBtn');
        
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const playbackCanvas = document.getElementById('playbackCanvas');
        const playbackCtx = playbackCanvas.getContext('2d');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeline = document.getElementById('timeline');
        const timelineProgress = document.getElementById('timelineProgress');
        const frameCountEl = document.getElementById('frameCount');
        const speedBtn = document.getElementById('speedBtn');
        
        let useFrontCamera = true;
        let showAngles = true;
        let showPoints = true;
        let stream = null;
        
        let lastTime = performance.now();
        let frameCounter = 0;
        
        let smoothedLandmarks = null;
        const SMOOTHING = 0.5;
        
        let isRecording = false;
        let recordedFrames = [];
        let recordStartTime = 0;
        
        let isPlaying = false;
        let playbackIndex = 0;
        let playbackSpeed = 1;
        let playbackRAF = null;
        let lastPlaybackTime = 0;
        
        const colors = {
            thumb: '#FFD700',
            index: '#00FF00',
            middle: '#00BFFF',
            ring: '#FF8C00',
            pinky: '#FF69B4'
        };
        
        const fingerIndices = {
            thumb: [0, 1, 2, 3, 4],
            index: [0, 5, 6, 7, 8],
            middle: [0, 9, 10, 11, 12],
            ring: [0, 13, 14, 15, 16],
            pinky: [0, 17, 18, 19, 20]
        };
        
        const palmConn = [[5,9], [9,13], [13,17], [0,5], [0,17]];
        
        function smooth(newLandmarks) {
            if (!smoothedLandmarks) {
                smoothedLandmarks = newLandmarks.map(l => ({x: l.x, y: l.y, z: l.z}));
                return smoothedLandmarks;
            }
            for (let i = 0; i < smoothedLandmarks.length; i++) {
                smoothedLandmarks[i].x += (newLandmarks[i].x - smoothedLandmarks[i].x) * (1 - SMOOTHING);
                smoothedLandmarks[i].y += (newLandmarks[i].y - smoothedLandmarks[i].y) * (1 - SMOOTHING);
                smoothedLandmarks[i].z += (newLandmarks[i].z - smoothedLandmarks[i].z) * (1 - SMOOTHING);
            }
            return smoothedLandmarks;
        }
        
        function getAngle(p1, p2, p3) {
            const v1 = {x: p1.x - p2.x, y: p1.y - p2.y};
            const v2 = {x: p3.x - p2.x, y: p3.y - p2.y};
            const dot = v1.x * v2.x + v1.y * v2.y;
            const m1 = Math.hypot(v1.x, v1.y);
            const m2 = Math.hypot(v2.x, v2.y);
            if (m1 === 0 || m2 === 0) return 0;
            return Math.round(Math.acos(Math.max(-1, Math.min(1, dot / (m1 * m2)))) * 180 / Math.PI);
        }
        
        function drawHand(context, landmarks, w, h, showPts, showAng) {
            if (!landmarks || landmarks.length < 21) return;
            
            const pts = landmarks.map(l => ({x: l.x * w, y: l.y * h}));
            
            context.strokeStyle = 'rgba(150,150,150,0.8)';
            context.lineWidth = 3;
            context.lineCap = 'round';
            palmConn.forEach(([i, j]) => {
                context.beginPath();
                context.moveTo(pts[i].x, pts[i].y);
                context.lineTo(pts[j].x, pts[j].y);
                context.stroke();
            });
            
            Object.entries(fingerIndices).forEach(([finger, indices]) => {
                context.strokeStyle = colors[finger];
                context.lineWidth = 4;
                for (let i = 1; i < indices.length - 1; i++) {
                    context.beginPath();
                    context.moveTo(pts[indices[i]].x, pts[indices[i]].y);
                    context.lineTo(pts[indices[i+1]].x, pts[indices[i+1]].y);
                    context.stroke();
                }
            });
            
            if (showPts) {
                pts.forEach((pt, i) => {
                    let color = '#666', r = 5;
                    if (i <= 4) color = colors.thumb;
                    else if (i <= 8) color = colors.index;
                    else if (i <= 12) color = colors.middle;
                    else if (i <= 16) color = colors.ring;
                    else color = colors.pinky;
                    
                    if ([4,8,12,16,20].includes(i)) r = 10;
                    else if (i === 0) { color = '#fff'; r = 8; }
                    
                    context.beginPath();
                    context.arc(pt.x, pt.y, r, 0, Math.PI * 2);
                    context.fillStyle = color;
                    context.fill();
                    context.strokeStyle = 'rgba(0,0,0,0.4)';
                    context.lineWidth = 1;
                    context.stroke();
                });
            }
            
            if (showAng) {
                context.font = 'bold 11px Arial';
                context.textAlign = 'center';
                context.fillStyle = '#fff';
                
                [[3,[2,3,4]], [6,[5,6,7]], [10,[9,10,11]], [14,[13,14,15]], [18,[17,18,19]]].forEach(([idx, p]) => {
                    const angle = getAngle(pts[p[0]], pts[p[1]], pts[p[2]]);
                    context.fillText(angle + '°', pts[idx].x, pts[idx].y - 10);
                });
            }
        }
        
        function onResults(results) {
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            frameCounter++;
            const now = performance.now();
            if (now - lastTime >= 500) {
                fpsEl.textContent = Math.round(frameCounter * 1000 / (now - lastTime)) + ' FPS';
                frameCounter = 0;
                lastTime = now;
            }
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = smooth(results.multiHandLandmarks[0]);
                drawHand(ctx, landmarks, canvas.width, canvas.height, showPoints, showAngles);
                
                if (isRecording) {
                    recordedFrames.push({
                        landmarks: landmarks.map(l => ({x: l.x, y: l.y, z: l.z}))
                    });
                }
                
                statusEl.textContent = isRecording ? '🔴 ' + recordedFrames.length : '✋ Détecté';
                statusEl.className = 'status' + (isRecording ? ' recording' : ' active');
            } else {
                smoothedLandmarks = null;
                statusEl.textContent = isRecording ? '🔴 REC...' : 'En attente...';
                statusEl.className = 'status' + (isRecording ? ' recording' : '');
            }
        }
        
        const hands = new Hands({
            locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
        });
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);
        
        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            loadingEl.classList.remove('hidden');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                video.classList.toggle('mirror', useFrontCamera);
                canvas.classList.toggle('mirror', useFrontCamera);
                camBadge.textContent = useFrontCamera ? '📷 Avant' : '📷 Arrière';
                
                video.onloadedmetadata = () => {
                    loadingEl.classList.add('hidden');
                    detectLoop();
                };
            } catch (err) {
                loadingEl.classList.add('hidden');
                statusEl.textContent = '❌ ' + err.message;
            }
        }
        
        async function detectLoop() {
            if (video.readyState >= 2) await hands.send({image: video});
            requestAnimationFrame(detectLoop);
        }
        
        function toggleRec() {
            if (isRecording) {
                isRecording = false;
                recBtn.classList.remove('rec-active');
                recBtn.textContent = '⏺️ REC';
                if (recordedFrames.length > 0) playBtn.classList.remove('hidden');
            } else {
                recordedFrames = [];
                recordStartTime = performance.now();
                isRecording = true;
                recBtn.classList.add('rec-active');
                recBtn.textContent = '⏹️ Stop';
                playBtn.classList.add('hidden');
            }
        }
        
        function openPlayback() {
            if (recordedFrames.length < 2) {
                alert('Pas assez de frames enregistrées');
                return;
            }
            modal.classList.remove('hidden');
            playbackIndex = 0;
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            renderPlaybackFrame();
        }
        
        function closePlayback() {
            modal.classList.add('hidden');
            stopPlayback();
        }
        
        function renderPlaybackFrame() {
            if (recordedFrames.length === 0) return;
            if (playbackIndex < 0) playbackIndex = 0;
            if (playbackIndex >= recordedFrames.length) playbackIndex = recordedFrames.length - 1;
            
            const frame = recordedFrames[playbackIndex];
            if (!frame || !frame.landmarks) return;
            
            playbackCtx.fillStyle = '#111';
            playbackCtx.fillRect(0, 0, playbackCanvas.width, playbackCanvas.height);
            drawHand(playbackCtx, frame.landmarks, playbackCanvas.width, playbackCanvas.height, true, true);
            
            const progress = recordedFrames.length > 1 ? (playbackIndex / (recordedFrames.length - 1)) * 100 : 0;
            timelineProgress.style.width = progress + '%';
            frameCountEl.textContent = (playbackIndex + 1) + ' / ' + recordedFrames.length;
        }
        
        function playbackLoop() {
            if (!isPlaying) return;
            
            playbackIndex++;
            if (playbackIndex >= recordedFrames.length) {
                playbackIndex = 0;
            }
            renderPlaybackFrame();
            
            playbackRAF = setTimeout(playbackLoop, 33 / playbackSpeed);
        }
        
        function startPlayback() {
            if (recordedFrames.length === 0) return;
            isPlaying = true;
            playPauseBtn.textContent = '⏸️';
            playbackLoop();
        }
        
        function stopPlayback() {
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            if (playbackRAF) {
                clearTimeout(playbackRAF);
                playbackRAF = null;
            }
        }
        
        function togglePlayback() {
            if (isPlaying) stopPlayback();
            else startPlayback();
        }
        
        function cycleSpeed() {
            const speeds = [0.5, 1, 2, 4];
            const idx = speeds.indexOf(playbackSpeed);
            playbackSpeed = speeds[(idx + 1) % speeds.length];
            speedBtn.textContent = playbackSpeed + 'x';
        }
        
        timeline.addEventListener('click', e => {
            if (recordedFrames.length === 0) return;
            const rect = timeline.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            playbackIndex = Math.floor(pct * (recordedFrames.length - 1));
            renderPlaybackFrame();
        });
        
        camBtn.onclick = () => { useFrontCamera = !useFrontCamera; startCamera(); };
        anglesBtn.onclick = () => { showAngles = !showAngles; anglesBtn.classList.toggle('active', showAngles); };
        pointsBtn.onclick = () => { showPoints = !showPoints; pointsBtn.classList.toggle('active', showPoints); };
        recBtn.onclick = toggleRec;
        playBtn.onclick = openPlayback;
        closeBtn.onclick = closePlayback;
        playPauseBtn.onclick = togglePlayback;
        speedBtn.onclick = cycleSpeed;
        
        hands.initialize().then(startCamera);
    </script>
</body>
</html>
